[binaries]
c = 'x86_64-w64-mingw32-clang'
cpp = 'x86_64-w64-mingw32-clang++'
ar = 'x86_64-w64-mingw32-ar'
ld = 'ld.lld'
strip = 'llvm-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = false

[built-in options]
# vcpkg's c.find_library doesn't add -I; inject the include dirs explicitly.
c_args = ['-IC:/GIT/vcpkg/installed/x64-mingw-static/include', '-IC:/GIT/sodi/freeciv-3.2.4/build-deps/mingw-pkgs/icu-extract/mingw64/include']
cpp_args = ['-IC:/GIT/vcpkg/installed/x64-mingw-static/include', '-IC:/GIT/sodi/freeciv-3.2.4/build-deps/mingw-pkgs/icu-extract/mingw64/include']
c_link_args = ['-LC:/GIT/vcpkg/installed/x64-mingw-static/lib', '-LC:/GIT/sodi/freeciv-3.2.4/build-deps/mingw-pkgs/icu-extract/mingw64/lib', '-lcrypt32', '-lsecur32', '-lwldap32', '-lnormaliz', '-liphlpapi', '-lbcrypt', '-ladvapi32', '-luserenv', '-lws2_32', '-lcomctl32', '-luxtheme']
cpp_link_args = ['-LC:/GIT/vcpkg/installed/x64-mingw-static/lib', '-LC:/GIT/sodi/freeciv-3.2.4/build-deps/mingw-pkgs/icu-extract/mingw64/lib', '-lcrypt32', '-lsecur32', '-lwldap32', '-lnormaliz', '-liphlpapi', '-lbcrypt', '-ladvapi32', '-luserenv', '-lws2_32', '-lcomctl32', '-luxtheme']
