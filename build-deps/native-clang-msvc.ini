[binaries]
c = 'clang'
cpp = 'clang++'
ar = 'llvm-lib'
ld = 'lld-link'
strip = 'llvm-strip'
windres = 'windres'
pkg-config = 'pkg-config'

[properties]
needs_exe_wrapper = false

[built-in options]
# Freeciv uses GNU-extension idioms (empty arg before , in __VA_ARGS__ inside
# LUASCRIPT_*_CAT macros). Clang's MSVC-compat preprocessor is lenient enough
# and matches what cl.exe would accept.
c_args = ['-fms-extensions', '-fms-compatibility', '-Wno-gnu-zero-variadic-macro-arguments', '-Wno-microsoft-anon-tag']
